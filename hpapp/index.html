<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hogwarts">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>The Four Houses of Hogwarts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0208;
    font-family: 'Cinzel', serif;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 55%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 5%  85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.2) 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }

  .title-container {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    text-align: center;
    padding: 18px 20px 10px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
  }

  .title-container h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1rem, 3vw, 2rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    color: transparent;
    background: linear-gradient(135deg, #c8a96e 0%, #f5e6c0 40%, #c8a96e 60%, #8b6914 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 12px rgba(200,169,110,0.5));
  }

  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.5rem, 1.2vw, 0.75rem);
    letter-spacing: 0.35em;
    color: rgba(200,169,110,0.5);
    margin-top: 4px;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 100vw; height: 100vh;
    position: relative; z-index: 1;
  }

  .house-btn {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden;
    border: none; outline: none; padding: 0;
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .house-btn:active { transform: scale(0.97); }

  .grid::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(to right,  transparent calc(50% - 1px), rgba(200,169,110,0.3) calc(50% - 1px), rgba(200,169,110,0.3) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom, transparent calc(50% - 1px), rgba(200,169,110,0.3) calc(50% - 1px), rgba(200,169,110,0.3) calc(50% + 1px), transparent calc(50% + 1px));
    pointer-events: none; z-index: 5;
  }

  .center-seal {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(60px, 8vw, 100px); height: clamp(60px, 8vw, 100px);
    z-index: 20; pointer-events: none;
  }

  /* ── House colours ── */
  .gryffindor { background: radial-gradient(ellipse at 30% 30%, #8B0000 0%, #4a0000 40%, #1a0000 100%); --house-glow: rgba(211,166,37,0.6); }
  .gryffindor::before { content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(45deg,transparent 0,transparent 30px,rgba(211,166,37,0.04) 30px,rgba(211,166,37,0.04) 31px), repeating-linear-gradient(-45deg,transparent 0,transparent 30px,rgba(211,166,37,0.04) 30px,rgba(211,166,37,0.04) 31px); }
  .gryffindor:hover { background: radial-gradient(ellipse at 30% 30%, #a00000 0%, #600000 40%, #200000 100%); }

  .hufflepuff { background: radial-gradient(ellipse at 70% 30%, #8B6914 0%, #4a3a00 40%, #1a1400 100%); --house-glow: rgba(240,199,94,0.6); }
  .hufflepuff::before { content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(0deg,transparent 0,transparent 18px,rgba(240,199,94,0.05) 18px,rgba(240,199,94,0.05) 19px), repeating-linear-gradient(90deg,transparent 0,transparent 18px,rgba(240,199,94,0.05) 18px,rgba(240,199,94,0.05) 19px); }
  .hufflepuff:hover { background: radial-gradient(ellipse at 70% 30%, #aa8020 0%, #605000 40%, #201a00 100%); }

  .ravenclaw  { background: radial-gradient(ellipse at 30% 70%, #0E2060 0%, #061030 40%, #000a1a 100%); --house-glow: rgba(148,107,45,0.6); }
  .ravenclaw::before  { content:''; position:absolute; inset:0; background-image: radial-gradient(ellipse at 50% 50%,rgba(148,107,45,0.08) 0%,transparent 70%); }
  .ravenclaw:hover  { background: radial-gradient(ellipse at 30% 70%, #1030a0 0%, #0a1a50 40%, #001020 100%); }

  .slytherin  { background: radial-gradient(ellipse at 70% 70%, #1A4a2a 0%, #0a2a14 40%, #001a08 100%); --house-glow: rgba(170,170,170,0.4); }
  .slytherin::before  { content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(120deg,transparent 0,transparent 40px,rgba(170,170,170,0.03) 40px,rgba(170,170,170,0.03) 41px); }
  .slytherin:hover  { background: radial-gradient(ellipse at 70% 70%, #206035 0%, #0f3820 40%, #002010 100%); }

  .crest {
    width: clamp(80px, 14vw, 180px); height: clamp(80px, 14vw, 180px);
    margin-bottom: clamp(10px, 2vh, 24px);
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.8));
    transition: transform 0.3s ease, filter 0.3s ease;
    flex-shrink: 0;
  }
  .house-btn:hover .crest {
    transform: scale(1.08) translateY(-4px);
    filter: drop-shadow(0 8px 30px rgba(0,0,0,0.9)) drop-shadow(0 0 20px var(--house-glow));
  }

  .house-name {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 700;
    font-size: clamp(0.9rem, 2.5vw, 1.8rem);
    letter-spacing: 0.12em; text-transform: uppercase;
    transition: letter-spacing 0.3s ease;
  }
  .house-btn:hover .house-name { letter-spacing: 0.2em; }
  .gryffindor .house-name { color: #D3A625; text-shadow: 0 0 20px rgba(211,166,37,0.5), 0 2px 4px rgba(0,0,0,0.8); }
  .hufflepuff .house-name { color: #F0C75E; text-shadow: 0 0 20px rgba(240,199,94,0.5), 0 2px 4px rgba(0,0,0,0.8); }
  .ravenclaw  .house-name { color: #c8a65e; text-shadow: 0 0 20px rgba(148,107,45,0.6),  0 2px 4px rgba(0,0,0,0.8); }
  .slytherin  .house-name { color: #AAAAAA; text-shadow: 0 0 20px rgba(170,170,170,0.4), 0 2px 4px rgba(0,0,0,0.8); }

  .house-motto {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.4rem, 1vw, 0.65rem);
    letter-spacing: 0.25em; margin-top: clamp(4px, 0.8vh, 10px);
    opacity: 0.55; text-transform: uppercase;
  }
  .gryffindor .house-motto { color: #D3A625; }
  .hufflepuff .house-motto { color: #F0C75E; }
  .ravenclaw  .house-motto { color: #c8a65e; }
  .slytherin  .house-motto { color: #AAAAAA; }

  .ripple {
    position: absolute; border-radius: 50%;
    transform: scale(0); animation: rippleAnim 0.7s linear;
    pointer-events: none;
  }
  .gryffindor .ripple { background: rgba(211,166,37,0.25); }
  .hufflepuff .ripple { background: rgba(240,199,94,0.25); }
  .ravenclaw  .ripple { background: rgba(148,107,45,0.25); }
  .slytherin  .ripple { background: rgba(170,170,170,0.2); }
  @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

  .corner-deco { position:absolute; width:50px; height:50px; opacity:0.2; pointer-events:none; }
  .corner-deco.tl { top:8px; left:8px; }
  .corner-deco.br { bottom:8px; right:8px; transform:scale(-1); }

  .house-btn { animation: fadeIn 0.8s ease both; }
  .gryffindor { animation-delay: 0.1s; }
  .hufflepuff { animation-delay: 0.25s; }
  .ravenclaw  { animation-delay: 0.4s; }
  .slytherin  { animation-delay: 0.55s; }
  @keyframes fadeIn { from { opacity:0; transform:scale(0.97); } to { opacity:1; transform:scale(1); } }

  .house-btn.speaking { animation: speakPulse 0.7s ease-in-out infinite alternate; }
  @keyframes speakPulse { from { filter:brightness(1); } to { filter:brightness(1.3) saturate(1.2); } }

  /* Update toast */
  #update-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(200,169,110,0.15); border: 1px solid rgba(200,169,110,0.4);
    color: rgba(200,169,110,0.9); font-family: 'Cinzel', serif;
    font-size: 0.7rem; letter-spacing: 0.2em;
    padding: 10px 20px; border-radius: 4px; cursor: pointer;
    backdrop-filter: blur(8px); z-index: 100;
    display: none; white-space: nowrap;
  }
  #update-toast.visible { display: block; animation: fadeIn 0.4s ease; }
</style>
</head>
<body>

<div class="title-container">
  <h1>The Four Houses of Hogwarts</h1>
  <p class="subtitle">Touch a house to hear its name</p>
</div>

  <!-- RAVENCLAW -->
  <button class="house-btn ravenclaw" onclick="speak('ravenclaw', this)" aria-label="Ravenclaw">

<!-- Center Hogwarts seal -->
<svg class="center-seal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="48" fill="#0a0208" stroke="rgba(200,169,110,0.5)" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(200,169,110,0.2)" stroke-width="1"/>
  <text x="50" y="60" text-anchor="middle" font-family="Cinzel Decorative,serif" font-size="32" font-weight="900" fill="rgba(200,169,110,0.7)">H</text>
</svg>

<!-- Update available toast -->
<div id="update-toast" onclick="applyUpdate()">✦ New version available — tap to update ✦</div>

<script>
  // ═══════════════════════════════════════════════════════════════
  //  AUDIO SLOTS
  //  Replace each null with a base64 data URI string, e.g.:
  //    'data:audio/mp3;base64,//uQxAAA...'
  //
  //  Expected files (any common format: mp3, ogg, wav, m4a):
  //    gryffindor.mp3  →  AUDIO.gryffindor
  //    hufflepuff.mp3  →  AUDIO.hufflepuff
  //    ravenclaw.mp3   →  AUDIO.ravenclaw
  //    slytherin.mp3   →  AUDIO.slytherin

  // ═══════════════════════════════════════════════════════════════

  let currentAudio = null;
  let currentBtn   = null;

  function triggerRipple(btn) {
    const r    = document.createElement('span');
    r.className = 'ripple';
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.5;
    r.style.cssText = `width:${size}px;height:${size}px;left:${rect.width/2-size/2}px;top:${rect.height/2-size/2}px`;
    btn.appendChild(r);
    setTimeout(() => r.remove(), 700);
  }

  function speak(house, btn) {
    triggerRipple(btn);

    // Stop whatever is playing
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
    if (currentBtn)   { currentBtn.classList.remove('speaking'); }

    const src = AUDIO[house];

    if (src) {
      // ── Embedded audio path ──
      const audio   = new Audio(src);
      currentAudio  = audio;
      currentBtn    = btn;
      btn.classList.add('speaking');
      audio.onended = audio.onerror = () => {
        btn.classList.remove('speaking');
        if (currentBtn === btn) { currentBtn = null; currentAudio = null; }
      };
      audio.play().catch(() => fallbackTTS(house, btn));
    } else {
      // ── Fallback: Web Speech API (until audio slots are filled) ──
      fallbackTTS(house, btn);
    }
  }

  // Fallback TTS — used until real audio is embedded
  function fallbackTTS(house, btn) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    setTimeout(() => {
      const utter = new SpeechSynthesisUtterance(house);
      utter.rate = 0.52; utter.pitch = 0.82; utter.volume = 1;
      const voices = window.speechSynthesis.getVoices();
      const pick = [
        v => v.name === 'Daniel',
        v => v.lang === 'en-GB',
        v => v.lang.startsWith('en-GB'),
        v => v.lang.startsWith('en'),
      ].reduce((found, test) => found || voices.find(test), null);
      if (pick) utter.voice = pick;
      currentBtn = btn;
      btn.classList.add('speaking');
      utter.onend = utter.onerror = () => {
        btn.classList.remove('speaking');
        if (currentBtn === btn) currentBtn = null;
      };
      window.speechSynthesis.speak(utter);
    }, 80);
  }

  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    window.speechSynthesis.getVoices();
  }

  // ═══════════════════════════════════════════════════════════════
  //  SERVICE WORKER  —  stale-while-revalidate update strategy
  // ═══════════════════════════════════════════════════════════════
  let newWorker = null;

  function applyUpdate() {
    if (newWorker) {
      newWorker.postMessage({ type: 'SKIP_WAITING' });
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {

      // If there's already a waiting worker on first load, show toast immediately
      if (reg.waiting) {
        newWorker = reg.waiting;
        document.getElementById('update-toast').classList.add('visible');
      }

      // Detect a new worker installing
      reg.addEventListener('updatefound', () => {
        const installing = reg.installing;
        installing.addEventListener('statechange', () => {
          if (installing.state === 'installed' && navigator.serviceWorker.controller) {
            // New version is ready and waiting — show toast
            newWorker = installing;
            document.getElementById('update-toast').classList.add('visible');
          }
        });
      });

      // When the new SW takes control, reload to get fresh UI
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });

      // Silently poll for updates every 60 seconds while the app is open
      setInterval(() => reg.update(), 60_000);

    }).catch(err => console.warn('SW registration failed:', err));
  }
</script>
